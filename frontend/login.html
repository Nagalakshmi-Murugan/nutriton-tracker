<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Caloriq - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="sidebar-logo auth-logo">
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="10" stroke="url(#lg1)" stroke-width="2"/>
          <path d="M6 11 Q11 5 16 11 Q11 17 6 11Z" fill="url(#lg2)"/>
          <defs>
            <linearGradient id="lg1" x1="0" y1="0" x2="22" y2="22"><stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
            <linearGradient id="lg2" x1="0" y1="0" x2="22" y2="22"><stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
          </defs>
        </svg>
      </div>
      <span class="logo-text">Caloriq</span>
    </div>

    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="auth-tab active">Log In</button>
      <button type="button" id="tabRegister" class="auth-tab">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="auth-form">
      <div class="form-field">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="form-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <p id="loginError" class="auth-error"></p>
      <button type="submit" class="form-submit-btn auth-submit">Log In</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="auth-form" style="display:none;">
      <div class="form-field">
        <label for="registerUsername">Username</label>
        <input type="text" id="registerUsername" autocomplete="username" minlength="3" required>
      </div>
      <div class="form-field">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="form-field">
        <label for="registerConfirm">Confirm Password</label>
        <input type="password" id="registerConfirm" autocomplete="new-password" minlength="6" required>
      </div>
      <p id="registerError" class="auth-error"></p>
      <button type="submit" class="form-submit-btn auth-submit">Create Account</button>
    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
